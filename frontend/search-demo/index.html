<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Search Demo</title>
  <style>
    body{font-family:Arial,sans-serif;max-width:1180px;margin:20px auto;padding:0 12px}
    .card{border:1px solid #ddd;border-radius:8px;padding:12px;margin-bottom:12px}
    .row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
    label{font-size:12px;color:#555;display:block;margin:4px 0}
    input,button,textarea{padding:8px}
    input{min-width:160px}
    table{width:100%;border-collapse:collapse;margin-top:12px}
    th,td{border:1px solid #ddd;padding:6px;font-size:12px}
    pre{background:#f8f8f8;padding:10px;white-space:pre-wrap}
    .hint{font-size:12px;color:#666}
  </style>
</head>
<body>
  <h1>搜索服务前端示例（接近历史 Streamlit 交互）</h1>

  <div class="card">
    <div class="row">
      <div>
        <label>服务地址</label>
        <input id="base" value="http://127.0.0.1:8080" style="width:240px" />
      </div>
      <button id="healthBtn">Health</button>
      <button id="fieldsBtn">Fields</button>
    </div>
  </div>

  <div class="card">
    <h3>查询区</h3>
    <div class="row">
      <div>
        <label>语义查询</label>
        <input id="query" value="前门铰链" style="width:320px" />
      </div>
      <div>
        <label>top_k</label>
        <input id="topk" type="number" value="20" style="width:90px" />
      </div>
      <button id="searchBtn">结构化搜索 /search</button>
      <button id="nlBtn">自然语言搜索 /search/nl</button>
    </div>

    <h4>预置筛选字段</h4>
    <div class="row">
      <div>
        <label>重量下限（kg）weight_kg >=</label>
        <input id="weightMin" type="number" step="0.001" placeholder="0.1" />
      </div>
      <div>
        <label>重量上限（kg）weight_kg <=</label>
        <input id="weightMax" type="number" step="0.001" placeholder="0.5" />
      </div>
      <div>
        <label>长度下限（mm）length_mm >=</label>
        <input id="lengthMin" type="number" step="0.1" placeholder="100" />
      </div>
      <div>
        <label>长度上限（mm）length_mm <=</label>
        <input id="lengthMax" type="number" step="0.1" placeholder="500" />
      </div>
      <div>
        <label>宽度下限（mm）width_mm >=</label>
        <input id="widthMin" type="number" step="0.1" placeholder="50" />
      </div>
      <div>
        <label>宽度上限（mm）width_mm <=</label>
        <input id="widthMax" type="number" step="0.1" placeholder="300" />
      </div>
      <div>
        <label>高度下限（mm）height_mm >=</label>
        <input id="heightMin" type="number" step="0.1" placeholder="20" />
      </div>
      <div>
        <label>高度上限（mm）height_mm <=</label>
        <input id="heightMax" type="number" step="0.1" placeholder="200" />
      </div>
      <div>
        <label>深度下限（mm）depth_mm >=</label>
        <input id="depthMin" type="number" step="0.1" placeholder="20" />
      </div>
      <div>
        <label>深度上限（mm）depth_mm <=</label>
        <input id="depthMax" type="number" step="0.1" placeholder="200" />
      </div>
    </div>

    <div class="row">
      <label>高级 filters JSON（可选，会与预置字段合并）</label>
      <textarea id="filters" rows="2" cols="80" placeholder='[{"field":"quantity","op":">=","value":2}]'></textarea>
    </div>
    <div class="hint">提示：仅保留可量化参数筛选。重量/长宽高深会自动映射为区间 filters（`>=` 与 `<=`）。</div>
  </div>

  <div class="card">
    <h3>服务信息</h3>
    <pre id="meta"></pre>
  </div>

  <div class="card">
    <h3>结果</h3>
    <table>
      <thead>
      <tr>
        <th>rank</th><th>score</th><th>part_name</th><th>vehicle_name</th><th>weight_kg</th><th>length_mm</th><th>width_mm</th><th>height_mm</th><th>depth_mm</th><th>level_path</th><th>download</th>
      </tr>
      </thead>
      <tbody id="tbody"></tbody>
    </table>
  </div>

  <script src="./main.js"></script>
</body>
</html>
